[workspace]
resolver = "2"
members = ["crates/arbor-core", "crates/arbor-viewer", "crates/arbor-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Andrew"]

[workspace.dependencies]
glam = "0.30"
serde = { version = "1", features = ["derive"] }
ron = "0.9"
# Seeded draws only: nothing asks the OS for randomness, which the web cannot give.
rand = { version = "0.9", default-features = false, features = ["std", "small_rng"] }
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png", "tga", "jpeg", "hdr"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.32"
egui_glow = "0.32"
glow = "0.16"
# Native folder picker for choosing where exports go.
rfd = "0.17"
# Timing that works in a browser as well, where std::time::Instant panics.
web-time = "1.1"
# The web build: starting in a page, fetching textures, handing exports over as downloads.
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.73", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "Node", "Url", "Window"] }
js-sys = "0.3"
ehttp = "0.5"
log = "0.4"

arbor-core = { path = "crates/arbor-core" }
