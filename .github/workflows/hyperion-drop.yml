# Builds arbor-ffi the way tools/hyperion-drop.sh does, for each platform Hyperion's editor
# ships on, and publishes them as release assets, arbor-hyperion-<tag>-<platform>.zip. The
# ArborToolkit plugin downloads its platform's at a pinned tag and SHA-256 when it has no
# local drop. The texture sets stay out of them: Hyperion keeps those as BC texture assets in
# the plugin's Content.
#
# Push a tag named hyperion-drop-<anything> to publish one. A manual run only uploads the
# zips as workflow artifacts.
name: Hyperion drop

on:
  push:
    tags: ["hyperion-drop-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # the runners Hyperion's release workflow builds the editor on
          - { platform: windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { platform: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { platform: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # on Windows the script calls the toolchain by its full name, as a machine with the GNU one as default needs
      - name: Name the MSVC toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --target x86_64-pc-windows-msvc

      - name: Build
        shell: bash
        env:
          ARBOR_TARGET: ${{ matrix.target }}
        run: tools/hyperion-drop.sh --out dist/arbor

      - name: Package
        shell: bash
        run: |
          name="arbor-hyperion-${GITHUB_REF_NAME}-${{ matrix.platform }}.zip"
          cd dist/arbor
          cmake -E tar cf "../$name" --format=zip lib include native-libs.txt VERSION
          cd ..
          cmake -E sha256sum "$name" | tee "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: arbor-hyperion-${{ matrix.platform }}
          path: dist/arbor-hyperion-*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arbor-hyperion-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/arbor-hyperion-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hyperion drop $GITHUB_REF_NAME" \
            --notes "arbor-ffi for Hyperion's ArborToolkit plugin on Windows x64, macOS arm64 and Linux x64, built from $GITHUB_SHA. Pin the tag and each platform's SHA-256 in the plugin's Module.cmake."
