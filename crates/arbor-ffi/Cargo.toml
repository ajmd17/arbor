[package]
name = "arbor-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true

# A C API over arbor-core for engines that grow and draw the plants themselves.
# Hyperion's ArborToolkit plugin builds the static library from a submodule of this repo, with Corrosion.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
arbor-core = { path = "../arbor-core" }
ron.workspace = true
